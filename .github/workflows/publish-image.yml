name: Publish container image

on:
  pull_request:
  push:
    branches: [master, main, codex/luckyh-cloud-web]
    tags: ['v*']
    paths-ignore: ['deploy/k8s/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: node scripts/update-gitops-image.mjs --self-test

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Image tags
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/stop-bullshit/luckyh-cloud-web
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request' }}
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: COMMIT_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate Nginx configuration
        env:
          IMAGE_TAG: ghcr.io/stop-bullshit/luckyh-cloud-web:sha-${{ github.sha }}
        run: docker run --rm -e GATEWAY_UPSTREAM=http://127.0.0.1:8080 "$IMAGE_TAG" nginx -t
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref_name == github.event.repository.default_branch)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref_name == github.event.repository.default_branch)
        run: docker push --all-tags ghcr.io/stop-bullshit/luckyh-cloud-web

  gitops:
    needs: image
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gitops-web-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true
      - name: Update deployed image
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin "$DEFAULT_BRANCH"
            git checkout -B gitops-update FETCH_HEAD
            if ! git merge-base --is-ancestor "$SOURCE_SHA" HEAD; then
              echo 'Source commit is no longer on the default branch; skipping deployment.'
              exit 0
            fi
            newer=$(git log --format=%H --max-count=1 "$SOURCE_SHA..HEAD" -- . ':(exclude)deploy/k8s/**')
            if [ -n "$newer" ]; then
              echo 'A newer code commit is awaiting its build; skipping this older image.'
              exit 0
            fi
            authors=$(git log --format=%ae "$SOURCE_SHA..HEAD" -- deploy/k8s/web.yaml)
            if [ -n "$authors" ] && printf '%s\n' "$authors" | grep -vFx '41898282+github-actions[bot]@users.noreply.github.com' >/dev/null; then
              echo 'The deployment manifest was changed manually after this build started; preserving that change.'
              exit 0
            fi
            node scripts/update-gitops-image.mjs "$SOURCE_SHA"
            if git diff --quiet -- deploy/k8s/web.yaml; then
              echo 'The deployment already uses this image.'
              exit 0
            fi
            git add deploy/k8s/web.yaml
            git commit -m "chore(deploy): update web image to sha-$SOURCE_SHA"
            if git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"; then
              exit 0
            fi
          done
          echo 'Deployment commit could not be pushed after three attempts.' >&2
          exit 1
